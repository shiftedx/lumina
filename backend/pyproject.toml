[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumina-backend"
version = "0.4.0"
description = "Local-first backend for a yt-dlp powered media library"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "Authlib==1.9.1",
  "libarchive-c==5.3",
  "PyMuPDF==1.28.2",
  "fastapi>=0.116.0,<1.0.0",
  "faiss-cpu==1.15.1",
  "httpx>=0.28.0,<1.0.0",
  "mutagen==1.48.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "Pillow==13.0.0",
  "pillow-heif==1.8.1",
  "pydantic-settings>=2.7.0,<3.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "yt-dlp[default]>=2025.3.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
