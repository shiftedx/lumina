name: Music Rework full gate
on:
  push:
    branches: ["music-rework/355-compatible-runner"]
permissions:
  contents: read
jobs:
  check:
    name: make check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            browser_workers: 3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fcffcc694887cd9da5c2586d2f0d3bb098978b03
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install locked dependencies and browser engines
        shell: bash
        run: |
          set -euo pipefail
          brew install ffmpeg@8
          ffmpeg_bin="$(brew --prefix ffmpeg@8)/bin"
          printf '%s\n' "$ffmpeg_bin" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_bin:$PATH"
          sw_vers
          uname -m
          ffmpeg -version
          mise exec -- python -c 'import sqlite3,sys; print(sys.version, sqlite3.sqlite_version)'
          mise exec -- make bootstrap
          cd frontend
          mise exec -- npx playwright install chromium firefox webkit
      - name: Build the matching synthetic fixture encoder
        shell: bash
        run: |
          set -euo pipefail
          fixture_tools="$RUNNER_TEMP/lumina-fixture-tools"
          mkdir -p "$fixture_tools"
          x265_sha=a2270c67fc2ea5a74824435cd72a9ad1441f9052d8490ab3e56ab5781bd7ad3c
          x265_token=$(curl -fsSL 'https://ghcr.io/token?service=ghcr.io&scope=repository:homebrew/core/x265:pull' | jq -r .token)
          curl -fsSL -H "Authorization: Bearer $x265_token" "https://ghcr.io/v2/homebrew/core/x265/blobs/sha256:$x265_sha" -o "$fixture_tools/x265.tar.gz"
          printf '%s  %s\n' "$x265_sha" "$fixture_tools/x265.tar.gz" | shasum -a 256 --check
          tar -xzf "$fixture_tools/x265.tar.gz" -C "$fixture_tools"
          x265="$fixture_tools/x265/4.1"
          sed -i '' "s|@@HOMEBREW_CELLAR@@|$fixture_tools|g" "$x265/lib/pkgconfig/x265.pc"
          install_name_tool -id "$x265/lib/libx265.215.dylib" "$x265/lib/libx265.215.dylib"
          codesign --force --sign - "$x265/lib/libx265.215.dylib"
          ffmpeg_sha=05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41
          curl -fsSL https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz -o "$fixture_tools/ffmpeg.tar.xz"
          printf '%s  %s\n' "$ffmpeg_sha" "$fixture_tools/ffmpeg.tar.xz" | shasum -a 256 --check
          tar -xf "$fixture_tools/ffmpeg.tar.xz" -C "$fixture_tools"
          cd "$fixture_tools/ffmpeg-8.0.1"
          export PKG_CONFIG_PATH="$x265/lib/pkgconfig"
          ./configure --prefix="$fixture_tools/ffmpeg" --disable-doc --disable-debug --disable-ffplay --disable-autodetect --enable-gpl --enable-libx265 > "$RUNNER_TEMP/fixture-ffmpeg-configure.log"
          make -j3 > "$RUNNER_TEMP/fixture-ffmpeg-build.log" 2>&1
          make install > /dev/null
          "$fixture_tools/ffmpeg/bin/ffmpeg" -version | head -3
      - name: Generate the documented synthetic M2TS corpus
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/dovi.zip" https://github.com/quietvoid/dovi_tool/releases/download/2.3.4/dovi_tool-2.3.4-universal-macOS.zip
          printf '%s  %s\n' 30d4f512eb67b7f1632cd28be5c62989bedad23f4710578aafc20c384b48ece6 "$RUNNER_TEMP/dovi.zip" | shasum -a 256 --check
          unzip -j "$RUNNER_TEMP/dovi.zip" "*/dovi_tool" -d "$RUNNER_TEMP/dovi" || unzip -j "$RUNNER_TEMP/dovi.zip" dovi_tool -d "$RUNNER_TEMP/dovi"
          "$RUNNER_TEMP/dovi/dovi_tool" --version
          PATH="$RUNNER_TEMP/lumina-fixture-tools/ffmpeg/bin:$PATH" mise exec -- python3 apple/scripts/generate_dv_m2ts_fixtures.py --dovi-tool "$RUNNER_TEMP/dovi/dovi_tool" --output "$RUNNER_TEMP/lumina-m2ts" --positives-only --cold-seek-duration-seconds 96 --cold-seek-variable-gop-pattern 288,24,72
      - name: Preflight the exact MEL packet offset assertions
        shell: bash
        run: |
          LUMINA_DV_M2TS_FIXTURES="$RUNNER_TEMP/lumina-m2ts" backend/.venv/bin/python -m pytest backend/tests/test_probe_streams.py -k 'irap_index_uses_pes_starts_for_bl_and_el_first' -q -p no:cacheprovider
      - name: Run all make check targets
        shell: bash
        env:
          E2E_TIER_WORKERS: ${{ matrix.browser_workers }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          export LUMINA_DV_M2TS_FIXTURES="$RUNNER_TEMP/lumina-m2ts"
          mise exec -- make check BACKEND_WORKERS=1 E2E_TIER_WORKERS="$E2E_TIER_WORKERS" BACKEND_OUTPUT="$RUNNER_TEMP/lumina-backend" E2E_OUTPUT="$RUNNER_TEMP/lumina-browser"
      - name: Identify failed cases
        if: failure()
        shell: bash
        run: |
          mise exec -- python3 - <<'PYTHON'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path(os.environ["RUNNER_TEMP"]) / "lumina-backend"
          for report in sorted(root.glob("run-*/junit.xml")):
              for case in ElementTree.parse(report).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      print(f"{case.get('classname')}.{case.get('name')}")
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-reports-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/lumina-backend/report.json
            ${{ runner.temp }}/lumina-browser/full-report.json
          if-no-files-found: ignore
          retention-days: 30
